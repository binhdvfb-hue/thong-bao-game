name: Run Game Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Khóa chống trùng: Đảm bảo luôn chỉ có duy nhất 1 bot chạy, không bao giờ bị nhân đôi tiến trình
concurrency:
  group: run-game-bot-single
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run bot script
        run: python bot.py

      - name: Save seen state
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.txt
          git diff --staged --quiet || (git commit -m "Update seen notifications" && git pull --rebase && git push)
